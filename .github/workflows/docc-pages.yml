name: Deploy DocC tutorial to GitHub Pages

on:
  push:
    branches: [addSpatialLayout]
    paths:
      - "SolarSystemSpatialLayout.docc/**"
      - ".github/workflows/docc-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build DocC archive
        run: |
          xcrun docc convert SolarSystemSpatialLayout.docc \
            --output-path _site \
            --fallback-display-name SolarSystem \
            --fallback-bundle-identifier com.spatialcomputingtechmap.solarsystemspatiallayout \
            --hosting-base-path "${{ github.event.repository.name }}" \
            --transform-for-static-hosting

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
