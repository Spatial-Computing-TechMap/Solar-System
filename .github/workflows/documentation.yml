name: Build and deploy DocC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build DocC archive
        run: >-
          xcodebuild docbuild
          -project Tutorial.xcodeproj
          -scheme Tutorial
          -destination 'generic/platform=visionOS'
          -derivedDataPath .build/DocC
          CODE_SIGNING_ALLOWED=NO

      - name: Transform archive for GitHub Pages
        shell: bash
        run: |
          archive_path="$(find .build/DocC -name 'Tutorial.doccarchive' -print -quit)"
          if [[ -z "$archive_path" ]]; then
            echo "Tutorial.doccarchive was not produced."
            exit 1
          fi

          xcrun docc process-archive transform-for-static-hosting \
            "$archive_path" \
            --output-path .build/site \
            --hosting-base-path "${{ github.event.repository.name }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
